name: Update Contribution Heatmap

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger

jobs:
  refresh-heatmap:
    name: Generate Cyan-Blue Heatmap
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Custom Heatmap SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_contribution_heatmap.py --username ALLENJOE-A --output assets/contribution-heatmap.svg

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-heatmap.svg
          if git diff --staged --quiet; then
            echo "Heatmap is up to date. No changes to commit."
          else
            git commit -m "chore: auto-update contribution heatmap [skip ci]"
            git push
          fi
