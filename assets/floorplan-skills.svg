<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .chip-bg { fill: #0D1117; }
      .chip-border { fill: none; stroke: #00D9FF; stroke-width: 1.5; }
      .macro-block { stroke-width: 1.5; rx: 2; }
      .macro-label { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .macro-sub { font-size: 9px; fill: #8899AA; }
      .route-line { stroke-width: 1; fill: none; }
      .via { r: 3; }
      .section-title { font-size: 11px; fill: #3A6A7A; letter-spacing: 3px; }
      .die-label { font-size: 9px; fill: #2A4A5A; }
      .power-ring { fill: none; stroke: #FF6B6B; stroke-width: 1; stroke-dasharray: 4,2; opacity: 0.3; }
      .grid-line { stroke: #0A1A2A; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="chip-bg" width="880" height="520" rx="0"/>

  <!-- Die border -->
  <rect class="chip-border" x="15" y="15" width="850" height="490" rx="1"/>

  <!-- Power ring (VDD/VSS) -->
  <rect class="power-ring" x="25" y="25" width="830" height="470"/>
  <rect class="power-ring" x="30" y="30" width="820" height="460"/>

  <!-- Faint grid overlay -->
  <g opacity="0.15">
    <line class="grid-line" x1="40" y1="40" x2="40" y2="500"/>
    <line class="grid-line" x1="140" y1="40" x2="140" y2="500"/>
    <line class="grid-line" x1="240" y1="40" x2="240" y2="500"/>
    <line class="grid-line" x1="340" y1="40" x2="340" y2="500"/>
    <line class="grid-line" x1="440" y1="40" x2="440" y2="500"/>
    <line class="grid-line" x1="540" y1="40" x2="540" y2="500"/>
    <line class="grid-line" x1="640" y1="40" x2="640" y2="500"/>
    <line class="grid-line" x1="740" y1="40" x2="740" y2="500"/>
    <line class="grid-line" x1="840" y1="40" x2="840" y2="500"/>
    <line class="grid-line" x1="40" y1="60" x2="840" y2="60"/>
    <line class="grid-line" x1="40" y1="140" x2="840" y2="140"/>
    <line class="grid-line" x1="40" y1="220" x2="840" y2="220"/>
    <line class="grid-line" x1="40" y1="300" x2="840" y2="300"/>
    <line class="grid-line" x1="40" y1="380" x2="840" y2="380"/>
    <line class="grid-line" x1="40" y1="460" x2="840" y2="460"/>
  </g>

  <!-- Section title -->
  <text class="section-title" x="440" y="55" text-anchor="middle">CHIP FLOORPLAN  &#x2014;  SKILLS &amp; EXPERTISE</text>

  <!-- ==================== MACRO BLOCKS ==================== -->

  <!-- PHYSICAL_DESIGN - largest block (top-left, wide) -->
  <rect class="macro-block" x="45" y="75" width="310" height="150" fill="#0A1E2E" stroke="#00D9FF"/>
  <text class="macro-label" x="200" y="130" text-anchor="middle">PHYSICAL_DESIGN</text>
  <text class="macro-sub" x="200" y="150" text-anchor="middle">Floorplanning | Place &amp; Route | CTS</text>
  <text class="macro-sub" x="200" y="165" text-anchor="middle">Power Planning | Timing Closure</text>
  <text class="macro-sub" x="200" y="180" text-anchor="middle">DRC/LVS | Sign-off</text>
  <!-- Instance label -->
  <text class="die-label" x="50" y="90">U_PD_TOP</text>

  <!-- RTL_DESIGN - large block (top-right) -->
  <rect class="macro-block" x="385" y="75" width="250" height="150" fill="#0A1E2E" stroke="#00BFFF"/>
  <text class="macro-label" x="510" y="130" text-anchor="middle">RTL_DESIGN</text>
  <text class="macro-sub" x="510" y="150" text-anchor="middle">Verilog | SystemVerilog</text>
  <text class="macro-sub" x="510" y="165" text-anchor="middle">FSM | Pipeline | Low-Power</text>
  <text class="macro-sub" x="510" y="180" text-anchor="middle">Digital Logic Optimization</text>
  <text class="die-label" x="390" y="90">U_RTL_CORE</text>

  <!-- VERIFICATION - medium block (top-far-right) -->
  <rect class="macro-block" x="665" y="75" width="185" height="150" fill="#0A1E2E" stroke="#00FF88"/>
  <text class="macro-label" x="757" y="125" text-anchor="middle">VERIFICATION</text>
  <text class="macro-sub" x="757" y="145" text-anchor="middle">Testbenches | SVA</text>
  <text class="macro-sub" x="757" y="160" text-anchor="middle">Functional Coverage</text>
  <text class="macro-sub" x="757" y="175" text-anchor="middle">UVM | Assertions</text>
  <text class="die-label" x="670" y="90">U_VERIF</text>

  <!-- TCAD_DEVICE - medium block (bottom-left) -->
  <rect class="macro-block" x="45" y="260" width="260" height="140" fill="#0A1E2E" stroke="#FF6B6B"/>
  <text class="macro-label" x="175" y="310" text-anchor="middle">TCAD_DEVICE</text>
  <text class="macro-sub" x="175" y="330" text-anchor="middle">Synopsys Sentaurus TCAD</text>
  <text class="macro-sub" x="175" y="345" text-anchor="middle">MOSFET | FinFET | VTFET</text>
  <text class="macro-sub" x="175" y="360" text-anchor="middle">Device Physics | Process Sim</text>
  <text class="die-label" x="50" y="275">U_TCAD</text>

  <!-- GNN_RESEARCH - medium block (bottom-center) -->
  <rect class="macro-block" x="335" y="260" width="240" height="140" fill="#0A1E2E" stroke="#C084FC"/>
  <text class="macro-label" x="455" y="310" text-anchor="middle">GNN_RESEARCH</text>
  <text class="macro-sub" x="455" y="330" text-anchor="middle">Graph Neural Networks</text>
  <text class="macro-sub" x="455" y="345" text-anchor="middle">Edge Placement Error (EPE)</text>
  <text class="macro-sub" x="455" y="360" text-anchor="middle">Computational Lithography</text>
  <text class="die-label" x="340" y="275">U_GNN_ML</text>

  <!-- EMBEDDED_SYS - smaller block (bottom-right) -->
  <rect class="macro-block" x="605" y="260" width="245" height="140" fill="#0A1E2E" stroke="#FFD93D"/>
  <text class="macro-label" x="727" y="310" text-anchor="middle">EMBEDDED_SYS</text>
  <text class="macro-sub" x="727" y="330" text-anchor="middle">STM32 | FPGA | ADC/DMA</text>
  <text class="macro-sub" x="727" y="345" text-anchor="middle">C / Embedded C</text>
  <text class="macro-sub" x="727" y="360" text-anchor="middle">Real-time Systems</text>
  <text class="die-label" x="610" y="275">U_EMBED</text>

  <!-- ANALOG_MIXED - small block (bottom row, below TCAD) -->
  <rect class="macro-block" x="45" y="430" width="180" height="60" fill="#0A1E2E" stroke="#FF9F43"/>
  <text class="macro-label" x="135" y="458" text-anchor="middle" style="font-size:11px">ANALOG_MS</text>
  <text class="macro-sub" x="135" y="475" text-anchor="middle">LTspice | Cascode Amp</text>
  <text class="die-label" x="50" y="444">U_AMS</text>

  <!-- ==================== ROUTING / INTERCONNECT ==================== -->

  <!-- PD -> RTL (horizontal) -->
  <line x1="355" y1="150" x2="385" y2="150" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
  <circle cx="355" cy="150" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="385" cy="150" r="2.5" fill="#00BFFF" opacity="0.8"/>

  <!-- RTL -> VERIF (horizontal) -->
  <line x1="635" y1="150" x2="665" y2="150" stroke="#00BFFF" stroke-width="1" opacity="0.6"/>
  <circle cx="635" cy="150" r="2.5" fill="#00BFFF" opacity="0.8"/>
  <circle cx="665" cy="150" r="2.5" fill="#00FF88" opacity="0.8"/>

  <!-- PD -> TCAD (vertical) -->
  <line x1="175" y1="225" x2="175" y2="260" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
  <circle cx="175" cy="225" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="175" cy="260" r="2.5" fill="#FF6B6B" opacity="0.8"/>

  <!-- RTL -> GNN (vertical, L-shaped) -->
  <polyline points="510,225 510,245 455,245 455,260" stroke="#00BFFF" stroke-width="1" fill="none" opacity="0.6"/>
  <circle cx="510" cy="225" r="2.5" fill="#00BFFF" opacity="0.8"/>
  <circle cx="455" cy="260" r="2.5" fill="#C084FC" opacity="0.8"/>

  <!-- VERIF -> EMBEDDED (vertical) -->
  <line x1="757" y1="225" x2="727" y2="260" stroke="#00FF88" stroke-width="1" opacity="0.6"/>
  <circle cx="757" cy="225" r="2.5" fill="#00FF88" opacity="0.8"/>
  <circle cx="727" cy="260" r="2.5" fill="#FFD93D" opacity="0.8"/>

  <!-- TCAD -> ANALOG (vertical) -->
  <line x1="135" y1="400" x2="135" y2="430" stroke="#FF6B6B" stroke-width="1" opacity="0.6"/>
  <circle cx="135" cy="400" r="2.5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="135" cy="430" r="2.5" fill="#FF9F43" opacity="0.8"/>

  <!-- GNN -> TCAD (horizontal) -->
  <line x1="305" y1="330" x2="335" y2="330" stroke="#FF6B6B" stroke-width="1" opacity="0.6"/>
  <circle cx="305" cy="330" r="2.5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="335" cy="330" r="2.5" fill="#C084FC" opacity="0.8"/>

  <!-- EMBEDDED -> GNN (horizontal) -->
  <line x1="575" y1="330" x2="605" y2="330" stroke="#C084FC" stroke-width="1" opacity="0.6"/>
  <circle cx="575" cy="330" r="2.5" fill="#C084FC" opacity="0.8"/>
  <circle cx="605" cy="330" r="2.5" fill="#FFD93D" opacity="0.8"/>

  <!-- ==================== LEGEND ==================== -->
  <text class="die-label" x="300" y="455">LEGEND:</text>
  <rect x="360" y="445" width="12" height="12" fill="none" stroke="#00D9FF" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="378" y="455">Physical Design</text>
  <rect x="470" y="445" width="12" height="12" fill="none" stroke="#00BFFF" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="488" y="455">RTL</text>
  <rect x="520" y="445" width="12" height="12" fill="none" stroke="#00FF88" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="538" y="455">Verification</text>
  <rect x="610" y="445" width="12" height="12" fill="none" stroke="#FF6B6B" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="628" y="455">TCAD</text>

  <rect x="360" y="465" width="12" height="12" fill="none" stroke="#C084FC" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="378" y="475">GNN/ML</text>
  <rect x="430" y="465" width="12" height="12" fill="none" stroke="#FFD93D" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="448" y="475">Embedded</text>
  <rect x="520" y="465" width="12" height="12" fill="none" stroke="#FF9F43" stroke-width="1.5" rx="1"/>
  <text class="die-label" x="538" y="475">Analog/MS</text>
  <circle cx="626" cy="471" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <text class="die-label" x="634" y="475">Via / Interconnect</text>

  <!-- Die corner label -->
  <text class="die-label" x="750" y="500">AJA_SKILLS_FLOORPLAN v1.0</text>
</svg>