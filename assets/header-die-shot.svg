<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .die-bg { fill: #0D1117; }
      .scribe-line { fill: none; stroke: #1A3A4A; stroke-width: 2; stroke-dasharray: 6,3; }
      .die-border { fill: none; stroke: #00D9FF; stroke-width: 1.5; }
      .alignment-mark { fill: none; stroke: #00D9FF; stroke-width: 1.5; }
      .name-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 42px; font-weight: 700; fill: #FFFFFF; }
      .title-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 14px; fill: #00D9FF; letter-spacing: 4px; }
      .reticle-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; fill: #3A5A6A; }
      .pad-ring { fill: none; stroke: #1A3A4A; stroke-width: 0.5; }
      .bond-pad { fill: #1A2A3A; stroke: #2A4A5A; stroke-width: 0.5; }
      .corner-cross { stroke: #00D9FF; stroke-width: 1; }
      .metal-trace { stroke: #0A2A3A; stroke-width: 0.3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="die-bg" width="900" height="220" rx="0"/>

  <!-- Outer scribe line (dashed) -->
  <rect class="scribe-line" x="8" y="8" width="884" height="204" rx="0"/>

  <!-- Die border (solid cyan) -->
  <rect class="die-border" x="20" y="20" width="860" height="180" rx="1"/>

  <!-- Corner alignment marks (crosshairs) -->
  <!-- Top-left -->
  <line class="corner-cross" x1="12" y1="20" x2="12" y2="36"/>
  <line class="corner-cross" x1="20" y1="12" x2="36" y2="12"/>
  <rect class="alignment-mark" x="24" y="24" width="10" height="10"/>

  <!-- Top-right -->
  <line class="corner-cross" x1="888" y1="20" x2="888" y2="36"/>
  <line class="corner-cross" x1="864" y1="12" x2="880" y2="12"/>
  <rect class="alignment-mark" x="866" y="24" width="10" height="10"/>

  <!-- Bottom-left -->
  <line class="corner-cross" x1="12" y1="184" x2="12" y2="200"/>
  <line class="corner-cross" x1="20" y1="208" x2="36" y2="208"/>
  <rect class="alignment-mark" x="24" y="186" width="10" height="10"/>

  <!-- Bottom-right -->
  <line class="corner-cross" x1="888" y1="184" x2="888" y2="200"/>
  <line class="corner-cross" x1="864" y1="208" x2="880" y2="208"/>
  <rect class="alignment-mark" x="866" y="186" width="10" height="10"/>

  <!-- Pad ring (tiny rectangles around the edge simulating bond pads) -->
  <!-- Top pads -->
  <g>
    <rect class="bond-pad" x="60" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="80" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="100" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="120" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="140" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="160" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="180" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="200" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="260" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="280" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="300" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="320" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="580" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="600" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="620" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="640" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="700" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="720" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="740" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="760" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="780" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="800" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="820" y="22" width="8" height="4"/>
    <rect class="bond-pad" x="840" y="22" width="8" height="4"/>
  </g>
  <!-- Bottom pads -->
  <g>
    <rect class="bond-pad" x="60" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="80" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="100" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="120" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="140" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="160" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="180" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="200" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="260" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="280" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="300" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="320" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="580" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="600" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="620" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="640" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="700" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="720" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="740" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="760" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="780" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="800" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="820" y="194" width="8" height="4"/>
    <rect class="bond-pad" x="840" y="194" width="8" height="4"/>
  </g>
  <!-- Left pads -->
  <g>
    <rect class="bond-pad" x="22" y="50" width="4" height="8"/>
    <rect class="bond-pad" x="22" y="70" width="4" height="8"/>
    <rect class="bond-pad" x="22" y="90" width="4" height="8"/>
    <rect class="bond-pad" x="22" y="110" width="4" height="8"/>
    <rect class="bond-pad" x="22" y="130" width="4" height="8"/>
    <rect class="bond-pad" x="22" y="150" width="4" height="8"/>
    <rect class="bond-pad" x="22" y="170" width="4" height="8"/>
  </g>
  <!-- Right pads -->
  <g>
    <rect class="bond-pad" x="874" y="50" width="4" height="8"/>
    <rect class="bond-pad" x="874" y="70" width="4" height="8"/>
    <rect class="bond-pad" x="874" y="90" width="4" height="8"/>
    <rect class="bond-pad" x="874" y="110" width="4" height="8"/>
    <rect class="bond-pad" x="874" y="130" width="4" height="8"/>
    <rect class="bond-pad" x="874" y="150" width="4" height="8"/>
    <rect class="bond-pad" x="874" y="170" width="4" height="8"/>
  </g>

  <!-- Faint metal routing traces in background -->
  <line class="metal-trace" x1="40" y1="60" x2="40" y2="160"/>
  <line class="metal-trace" x1="50" y1="40" x2="50" y2="180"/>
  <line class="metal-trace" x1="850" y1="60" x2="850" y2="160"/>
  <line class="metal-trace" x1="860" y1="40" x2="860" y2="180"/>
  <line class="metal-trace" x1="60" y1="40" x2="840" y2="40"/>
  <line class="metal-trace" x1="60" y1="180" x2="840" y2="180"/>

  <!-- Reticle/die labeling (top-metal style) -->
  <text class="reticle-label" x="45" y="44">LOT: AJA-2024 | WAFER: 01 | DIE: (0,0)</text>
  <text class="reticle-label" x="700" y="44">REV: 1.0 | PROCESS: 7nm</text>
  <text class="reticle-label" x="45" y="195">VIT CHENNAI FOUNDRY | VLSI ENGINEERING</text>
  <text class="reticle-label" x="700" y="195">github.com/ALLENJOE-A</text>

  <!-- Main name - top-metal label style -->
  <text class="name-text" x="450" y="105" text-anchor="middle">ALLEN JOE A</text>

  <!-- Title/subtitle -->
  <text class="title-text" x="450" y="140" text-anchor="middle">VLSI ENGINEER  &#x2022;  CHIP DESIGNER  &#x2022;  RTL DEVELOPER</text>

  <!-- Thin underline accent -->
  <line x1="250" y1="150" x2="650" y2="150" stroke="#00D9FF" stroke-width="0.5" opacity="0.4"/>

  <!-- Small detail text -->
  <text class="reticle-label" x="450" y="168" text-anchor="middle" fill="#3A6A7A">Electronics &amp; VLSI Engineering | VIT Chennai | Chennai, India</text>
</svg>